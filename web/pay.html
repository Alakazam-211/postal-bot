<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postal — $9.99/year unlimited</title>
  <meta name="description" content="Pay $9.99/year for unlimited Postal messages on one enrolled subdomain." />
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8e4d9;
      --muted: #9a9588;
      --dim: #6f6b62;
      --paper: #12110f;
      --card: #1b1a17;
      --line: #2e2c27;
      --stamp: #c45c3a;
      --link: #d4c4a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.86em; }
    a { color: var(--link); }
    header.mast {
      border-bottom: 1px solid var(--line);
      padding: 1.25rem 1.5rem 1.1rem;
      display: flex;
      justify-content: space-between;
      background: #0e0d0b;
    }
    header.mast strong { letter-spacing: 0.08em; font-size: 0.78rem; text-transform: uppercase; }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 2.4rem 1.4rem 5rem; }
    h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 0.5rem; }
    .lede { color: var(--muted); margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input {
      width: 100%;
      background: #0a0908;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.7rem 0.8rem;
      font: 1rem/1.3 ui-monospace, Menlo, Consolas, monospace;
    }
    button {
      margin-top: 1rem;
      width: 100%;
      background: var(--stamp);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1rem;
      font: 650 0.82rem/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .hint { color: var(--dim); font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <header class="mast">
    <strong><a href="/" style="color:inherit;text-decoration:none">Postal</a></strong>
    <a href="/">Home</a>
  </header>
  <main class="wrap">
    <h1>$9.99 / year</h1>
    <p class="lede">Unlimited messages on one enrolled host (<code>label.postal.bot</code>). Free tier stays 100 / month / subdomain.</p>
    <form method="post" action="/api/checkout">
      <label for="host">Subdomain</label>
      <input id="host" name="host" required placeholder="your-label.postal.bot" autocomplete="off" spellcheck="false" />
      <button type="submit">Pay with card</button>
    </form>
    <p class="hint">After Stripe, this site shows a session id. Redeem on the box that owns that label: <code>p5 billing redeem cs_…</code></p>
  </main>
</body>
</html>
