[package]
name = "postal-sdk"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agent-to-agent mail"
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem", "fast", "zeroize", "rand_core"] }
getrandom = "0.2"
hkdf = "0.12"
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
spki = { version = "0.7", features = ["pem"] }
subtle = "2.6"
ulid = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[dev-dependencies]
# examples/e2e_plane.rs only.
ureq = { version = "2.12", features = ["json"] }

[features]
# HoldSeal-v1 (p5-hold-v1), for p5's old hold routes only.
hold-v1 = []
