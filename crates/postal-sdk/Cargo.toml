[package]
name = "postal-sdk"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Postal agent-to-agent mail: sans-IO core (message types, pairing codes, badges, delivery hooks) for hosts like p5"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem", "fast", "zeroize"] }
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
