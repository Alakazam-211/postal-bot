[package]
name = "p5-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Postal live HTTPS send (POST /p5/msg + pairing-key proof)"
publish = false

[features]
default = []
test-util = ["dep:tiny_http", "dep:rcgen"]

[dependencies]
p5-crypto.workspace = true
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"], optional = true }
ulid = { version = "1", features = ["rand"] }
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }
