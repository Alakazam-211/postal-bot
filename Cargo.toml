[workspace]
resolver = "2"
members = [
    "crates/p5",
    "crates/p5-core",
    "crates/p5-crypto",
    "crates/p5-live",
    "crates/p5-plane",
    "crates/p5-tunnel",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Alakazam-211/postal-bot"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
p5-core = { path = "crates/p5-core" }
p5-crypto = { path = "crates/p5-crypto" }
p5-live = { path = "crates/p5-live" }
p5-plane = { path = "crates/p5-plane" }
p5-tunnel = { path = "crates/p5-tunnel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
